# FilmStack — Unified Platform Docker Compose
# One command to run the entire filmmaker ecosystem.
#
# Usage:
#   cp .env.example .env    # Configure your secrets
#   docker compose up -d    # Start everything
#
# Services:
#   - PostgreSQL 16 (shared database)
#   - Redis 7 (caching, sessions, queues)
#   - Festival API (port 3001)
#   - Streaming API (port 3002)
#   - Festival Web (port 3000)
#   - Streaming Web (port 3003)

services:
  # ─── Infrastructure ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: filmstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-filmstack}
      POSTGRES_USER: ${DB_USER:-filmstack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-filmstack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filmstack

  redis:
    image: redis:7-alpine
    container_name: filmstack-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - filmstack

  # ─── Backend APIs ───────────────────────────────────────────────────
  festival-api:
    build:
      context: .
      dockerfile: apps/festival-api/Dockerfile
    container_name: filmstack-festival-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-filmstack}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-filmstack}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      FRONTEND_URL: ${FESTIVAL_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@filmstack.com}
      UPLOAD_PATH: /app/uploads
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - festival_uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - filmstack

  streaming-api:
    build:
      context: .
      dockerfile: apps/streaming-api/Dockerfile
    container_name: filmstack-streaming-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-filmstack}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-filmstack}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      FRONTEND_URL: ${STREAMING_URL:-http://localhost:3003}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@filmstack.com}
      UPLOAD_PATH: /app/uploads
      USE_CDN: ${USE_CDN:-false}
      BUNNY_API_KEY: ${BUNNY_API_KEY}
      BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID}
      CDN_HOSTNAME: ${CDN_HOSTNAME}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - filmstack

  # ─── Frontend Apps ──────────────────────────────────────────────────
  festival-web:
    build:
      context: .
      dockerfile: apps/festival-web/Dockerfile
      args:
        VITE_API_URL: ${FESTIVAL_API_URL:-http://localhost:3001}
    container_name: filmstack-festival-web
    restart: unless-stopped
    depends_on:
      - festival-api
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - filmstack

  streaming-web:
    build:
      context: .
      dockerfile: apps/streaming-web/Dockerfile
      args:
        VITE_API_URL: ${STREAMING_API_URL:-http://localhost:3002}
    container_name: filmstack-streaming-web
    restart: unless-stopped
    depends_on:
      - streaming-api
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - filmstack

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  festival_uploads_data:
    driver: local

networks:
  filmstack:
    driver: bridge
